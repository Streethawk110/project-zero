# docker compose -f deploy/docker-compose.yml up -d --build
# Der Container lauscht nur lokal; nach außen per nginx/Apache (HTTPS) auf /pz/ weiterleiten.
services:
  project-zero:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PZ_HOST: 0.0.0.0
      PZ_DB: /data/project-zero.db
      PZ_BACKUP_DIR: /data/backups
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - pzdata:/data
    stop_grace_period: 20s
volumes:
  pzdata:
