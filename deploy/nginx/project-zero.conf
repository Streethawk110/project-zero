# Project Zero – Ausschnitt für einen BESTEHENDEN nginx-server-Block (HTTPS).
# Nicht als eigene Seite aktivieren, sondern im vorhandenen server { … } der Domain einbinden:
#     include /etc/nginx/snippets/project-zero.conf;
# Die bestehende Webseite bleibt unverändert: das Spiel liegt unter /spiel/, der Server unter /pz/.
# Zusätzlich nginx/project-zero-http.conf in den http { … }-Block (conf.d) legen.

# Spiel (statische Dateien aus apps/client/dist)
location /spiel/ {
    alias /var/www/project-zero/;
    index index.html;
}
# Gehashte Build-Dateien lange cachen …
location /spiel/assets/ {
    alias /var/www/project-zero/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
# … Modelle haben keine Hash-Namen: immer kurz beim Server nachfragen (ETag)
location /spiel/assets/models/ {
    alias /var/www/project-zero/assets/models/;
    add_header Cache-Control "no-cache";
}
# … Einstiegspunkte nie (sonst sehen Spieler nach einem Update alte Versionen)
location ~ ^/spiel/(sw\.js|precache\.json|config\.json|index\.html|manifest\.webmanifest)$ {
    alias /var/www/project-zero/$1;
    add_header Cache-Control "no-cache";
}
location = /spiel { return 301 /spiel/; }

# Spielserver: HTTP-API, Status und WebSocket
location /pz/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_pz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64k;
}
