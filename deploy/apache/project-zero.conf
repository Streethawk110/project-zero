# Project Zero – Ausschnitt für einen BESTEHENDEN Apache-VirtualHost (HTTPS, Port 443).
# Benötigt: a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# Im vorhandenen <VirtualHost *:443> einbinden:  Include /etc/apache2/project-zero.conf

Alias /spiel /var/www/project-zero
<Directory /var/www/project-zero>
    Require all granted
    Options -Indexes
    <FilesMatch "^(sw\.js|precache\.json|config\.json|index\.html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

# WebSocket zuerst, dann die HTTP-API
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/pz/ws$ ws://127.0.0.1:8787/ws [P,L]
ProxyPass        /pz/ http://127.0.0.1:8787/
ProxyPassReverse /pz/ http://127.0.0.1:8787/
ProxyTimeout 3600
